<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Dockarchy notification icon: a whale carrying containers, on a rounded tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2496ED"/>
      <stop offset="1" stop-color="#0B4FA8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- containers -->
  <g fill="#FFFFFF" stroke="#0B4FA8" stroke-width="2.5" stroke-linejoin="round">
    <rect x="30" y="52" width="16" height="14" rx="2"/>
    <rect x="48" y="52" width="16" height="14" rx="2"/>
    <rect x="66" y="52" width="16" height="14" rx="2"/>
    <rect x="48" y="36" width="16" height="14" rx="2"/>
    <rect x="66" y="36" width="16" height="14" rx="2"/>
    <rect x="66" y="20" width="16" height="14" rx="2"/>
  </g>
  <!-- whale body -->
  <path fill="#FFFFFF" d="M14 70
    C14 68 16 67 18 67 L92 67
    C100 67 104 61 110 60 C114 59.5 118 61 120 64
    C118 74 112 82 104 88 L100 90
    C86 100 68 104 50 100
    C34 96 22 88 16 78 C14 75 14 72 14 70 Z"/>
  <!-- tail -->
  <path fill="#FFFFFF" d="M96 88 C104 88 112 92 118 100 C110 98 104 100 100 106 C98 100 96 94 96 88 Z"/>
  <!-- eye -->
  <circle cx="106" cy="72" r="3.2" fill="#0B4FA8"/>
  <!-- waves -->
  <path fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"
        d="M18 110 C26 104 34 104 42 110 C50 116 58 116 66 110"/>
  <!-- badge: problem -->
  <circle cx="104" cy="24" r="17" fill="#F5A524" stroke="#FFFFFF" stroke-width="3.5"/>
  <path d="M104 14 L104 27" stroke="#1B1B1B" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="104" cy="33.5" r="2.6" fill="#1B1B1B"/>
</svg>
